<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz Result</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='result.css') }}" />
</head>
<body>
  <div class="result-container">
    <h1>Quiz Result</h1>

    <div class="info"><strong>Name:</strong> {{ name }}</div>
    <div class="info"><strong>Roll Number:</strong> {{ roll }}</div>
    <div class="info"><strong>Email:</strong> {{ email }}</div>

    <p class="score">Your Score: <strong>{{ score }}</strong> out of <strong>{{ total }}</strong></p>

    <a href="{{ url_for('quiz') }}" class="btn">Try Again</a>
  </div>
</body>
</html>
