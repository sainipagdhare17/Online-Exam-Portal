<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz Page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='quiz.css') }}" />
    <style>
        #timer {
            font-size: 20px;
            font-weight: bold;
            color: #4CAF50;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="quiz-container">
        <h1>Online Quiz</h1>
        <div id="timer">Time Remaining: 15:00</div>
        <form method="POST" action="{{ url_for('submit_quiz') }}">
            {% for q in questions %}
            {% set idx = loop.index0 %}
            <div class="question">
                <p>{{ q.text | safe }}</p>
                {% for option in q.options %}
                <label>
                    <input type="radio" name="q{{ idx }}" value="{{ option }}" required>
                    {{ option }}
                </label>
                {% endfor %}
            </div>
            {% endfor %}
            <button class="btn" type="submit">Submit Quiz</button>
        </form>

    </div>

    <script>
        let timeLeft = 15 * 60; // 15 minutes in seconds
        const timerEl = document.getElementById('timer');

        function updateTimer() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            timerEl.textContent = `Time Remaining: ${minutes}:${seconds}`;
            if (timeLeft === 0) {
                alert("Time is up! Your quiz will be submitted automatically.");
                document.getElementById('quizForm').submit();
            }
            timeLeft--;
        }

        updateTimer();
        setInterval(updateTimer, 1000);
    </script>
</body>

</html>
